<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — AI Model Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#090a0c;
  --panel:#0f1115;
  --panel2:#14171c;
  --panel3:#191c22;
  --line:#242832;
  --text:#f4f6f8;
  --muted:#8d95a3;
  --accent:#8b7cff;
  --accent2:#a99eff;
  --good:#42d392;
  --danger:#ff6677;
  --shadow:0 18px 60px rgba(0,0,0,.35);
  --radius:16px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 0%,rgba(139,124,255,.13),transparent 35%),
    var(--bg);
}

.auth-card{
  width:min(430px,100%);
  background:rgba(15,17,21,.92);
  border:1px solid var(--line);
  border-radius:24px;
  padding:34px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:20px;
  font-weight:800;
}

.logo-mark{
  width:36px;
  height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#9a8cff,#6758ed);
  box-shadow:0 8px 30px rgba(139,124,255,.28);
}

.auth-title{
  margin:34px 0 8px;
  font-size:31px;
  letter-spacing:-1px;
}

.auth-sub{
  color:var(--muted);
  line-height:1.6;
  margin-bottom:26px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:#b9bfca;
  font-size:13px;
  font-weight:650;
}

input,textarea,select{
  width:100%;
  background:#0b0d10;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 13px;
  outline:none;
  transition:.18s;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(139,124,255,.1);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px 16px;
  color:white;
  font-weight:750;
  background:linear-gradient(135deg,#8d7fff,#6759e9);
  box-shadow:0 8px 24px rgba(115,98,239,.22);
}

.secondary{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
}

.danger{
  border:1px solid rgba(255,102,119,.25);
  background:rgba(255,102,119,.08);
  color:#ff8794;
  border-radius:10px;
  padding:10px 14px;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
  font-size:13px;
}

.auth-switch button{
  border:0;
  background:none;
  color:var(--accent2);
}

/* APP */

.app{
  width:100%;
  height:100vh;
  display:flex;
  overflow:hidden;
}

.sidebar{
  width:248px;
  flex:none;
  background:#0c0e11;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:17px 13px;
}

.sidebar-brand{
  padding:4px 9px 22px;
}

.nav-section{
  margin:14px 9px 8px;
  font-size:10px;
  color:#606875;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#8e96a4;
  border-radius:10px;
  padding:10px 11px;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  transition:.15s;
}

.nav button:hover{
  background:#15181d;
  color:#e9ebef;
}

.nav button.active{
  background:#191722;
  color:white;
}

.nav-icon{
  width:20px;
  text-align:center;
  opacity:.9;
}

.sidebar-bottom{
  margin-top:auto;
}

.user-card{
  border:1px solid var(--line);
  background:#111318;
  border-radius:13px;
  padding:11px;
  display:flex;
  gap:10px;
  align-items:center;
}

.user-avatar{
  width:32px;
  height:32px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:#292d37;
  font-size:14px;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-email{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
  color:#d7dbe2;
}

.user-status{
  color:#69717e;
  font-size:10px;
  margin-top:2px;
}

.main{
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 75% 0%,rgba(139,124,255,.035),transparent 30%),
    var(--bg);
}

.topbar{
  height:64px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 25px;
  gap:14px;
}

.mobile-menu{
  display:none;
}

.top-title{
  font-size:15px;
  font-weight:750;
}

.top-spacer{
  flex:1;
}

.status-pill{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:#929aa7;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--good);
  box-shadow:0 0 12px rgba(66,211,146,.55);
}

.content{
  flex:1;
  overflow:auto;
  padding:30px;
}

/* PAGES */

.page{
  max-width:1180px;
  margin:0 auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:26px;
}

.page-title{
  margin:0;
  font-size:28px;
  letter-spacing:-.8px;
}

.page-sub{
  color:var(--muted);
  margin:7px 0 0;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.card{
  background:rgba(15,17,21,.9);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}

.stat{
  min-height:130px;
}

.stat-label{
  color:#818997;
  font-size:12px;
}

.stat-value{
  font-size:29px;
  font-weight:800;
  margin-top:14px;
  letter-spacing:-1px;
}

.stat-small{
  margin-top:7px;
  color:#69717d;
  font-size:11px;
}

.section{
  margin-top:18px;
}

.section-title{
  font-size:15px;
  font-weight:750;
  margin-bottom:12px;
}

.model-card{
  display:flex;
  align-items:center;
  gap:14px;
}

.model-avatar{
  width:48px;
  height:48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:#191b22;
  font-size:23px;
}

.model-info{
  flex:1;
  min-width:0;
}

.model-name{
  font-weight:750;
}

.model-desc{
  color:#737b88;
  font-size:12px;
  margin-top:4px;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:4px 8px;
  font-size:10px;
  font-weight:700;
}

.badge-green{
  color:#63e0a3;
  background:rgba(66,211,146,.1);
}

.badge-purple{
  color:#b0a5ff;
  background:rgba(139,124,255,.1);
}

.badge-gray{
  color:#939ba7;
  background:#191c22;
}

/* CHAT */

.chat-page{
  height:100%;
  display:flex;
  flex-direction:column;
  max-width:1000px;
  margin:auto;
}

.chat-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 0 20px;
}

.chat-avatar{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#292332,#171923);
  font-size:21px;
}

.chat-name{
  font-weight:800;
}

.chat-model{
  color:#707886;
  font-size:11px;
  margin-top:2px;
}

.chat-messages{
  flex:1;
  overflow:auto;
  padding:15px 4px 25px;
}

.empty-chat{
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
}

.empty-inner{
  max-width:510px;
}

.empty-icon{
  width:58px;
  height:58px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:18px;
  background:#17151f;
  font-size:27px;
}

.empty-chat h2{
  margin:20px 0 8px;
  font-size:27px;
}

.empty-chat p{
  color:#777f8d;
  line-height:1.6;
}

.message{
  display:flex;
  gap:12px;
  margin-bottom:22px;
}

.message.user{
  flex-direction:row-reverse;
}

.message-avatar{
  flex:none;
  width:30px;
  height:30px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#181b21;
  font-size:13px;
}

.message.user .message-avatar{
  background:#272232;
}

.message-body{
  max-width:min(720px,78%);
}

.message.user .message-body{
  text-align:right;
}

.message-content{
  display:inline-block;
  text-align:left;
  line-height:1.65;
  font-size:14px;
  color:#dfe2e7;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .message-content{
  background:#171a20;
  border:1px solid #242832;
  border-radius:15px 15px 4px 15px;
  padding:10px 13px;
}

.message.ai .message-content{
  padding-top:2px;
}

.composer{
  border:1px solid #292d36;
  background:#101216;
  border-radius:17px;
  padding:9px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  box-shadow:0 14px 40px rgba(0,0,0,.25);
}

.composer textarea{
  border:0;
  background:transparent;
  min-height:44px;
  max-height:160px;
  padding:10px 9px;
  resize:none;
  box-shadow:none;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#806ff2;
  color:white;
  font-size:17px;
}

.composer-hint{
  text-align:center;
  color:#4f5661;
  font-size:10px;
  margin-top:9px;
}

/* TRAINING */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.training-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:14px;
  align-items:start;
  border-top:1px solid var(--line);
  padding:16px 0;
}

.training-question{
  font-size:13px;
  font-weight:700;
}

.training-answer{
  font-size:12px;
  color:#89919e;
  line-height:1.5;
}

.meta{
  color:#59616e;
  font-size:10px;
  margin-top:6px;
}

/* SETTINGS */

.settings-grid{
  display:grid;
  grid-template-columns:250px 1fr;
  gap:18px;
}

.settings-nav{
  height:max-content;
}

.settings-nav button{
  width:100%;
  border:0;
  background:none;
  color:#7e8794;
  padding:11px;
  text-align:left;
  border-radius:9px;
}

.settings-nav button.active{
  background:#191b21;
  color:white;
}

/* TOAST */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:100;
  background:#171a20;
  border:1px solid #2a2e37;
  border-radius:12px;
  padding:12px 15px;
  box-shadow:var(--shadow);
  color:#e6e9ed;
  font-size:12px;
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* LOADING */

.loading{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#858d9a;
}

.spinner{
  width:14px;
  height:14px;
  border:2px solid #333844;
  border-top-color:#978aff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* RESPONSIVE */

@media(max-width:800px){
  .sidebar{
    position:fixed;
    left:-260px;
    top:0;
    bottom:0;
    z-index:50;
    transition:.2s;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
    border:0;
    background:none;
    color:white;
    font-size:20px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .content{
    padding:20px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .training-row{
    grid-template-columns:1fr;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authScreen" class="auth">
  <div class="auth-card">

    <div class="logo">
      <div class="logo-mark">N</div>
      Nova Studio
    </div>

    <h1 id="authTitle" class="auth-title">Welcome back.</h1>

    <div id="authSub" class="auth-sub">
      Sign in to build, train and use your AI models.
    </div>

    <form id="authForm">

      <div class="field" id="nameField" style="display:none">
        <label>Name</label>
        <input id="authName" placeholder="Your name">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>

      <button class="primary" id="authSubmit">Sign in</button>

    </form>

    <div class="auth-switch">
      <span id="authSwitchText">Don't have an account?</span>
      <button id="authSwitch">Create one</button>
    </div>

  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-brand">
      <div class="logo">
        <div class="logo-mark">N</div>
        Nova
      </div>
    </div>

    <div class="nav-section">Workspace</div>

    <nav class="nav">

      <button data-page="dashboard" class="active">
        <span class="nav-icon">⌂</span>
        Dashboard
      </button>

      <button data-page="chat">
        <span class="nav-icon">✦</span>
        Playground
      </button>

      <button data-page="models">
        <span class="nav-icon">◈</span>
        My Models
      </button>

      <button data-page="training">
        <span class="nav-icon">⌁</span>
        Training
      </button>

      <button data-page="knowledge">
        <span class="nav-icon">◇</span>
        Knowledge
      </button>

      <button data-page="memory">
        <span class="nav-icon">♢</span>
        Memory
      </button>

    </nav>

    <div class="nav-section">System</div>

    <nav class="nav">
      <button data-page="settings">
        <span class="nav-icon">⚙</span>
        Settings
      </button>

      <button data-page="diagnostics">
        <span class="nav-icon">⌘</span>
        Diagnostics
      </button>
    </nav>

    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-avatar">●</div>
        <div class="user-info">
          <div id="userEmail" class="user-email">Loading...</div>
          <div class="user-status">Connected</div>
        </div>
        <button id="logoutBtn" class="secondary" style="padding:6px 8px">↪</button>
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <button id="mobileMenu" class="mobile-menu">☰</button>
      <div id="topTitle" class="top-title">Dashboard</div>
      <div class="top-spacer"></div>

      <div class="status-pill">
        <span class="status-dot"></span>
        Nova system online
      </div>
    </header>

    <div id="content" class="content"></div>

  </main>

</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const { createClient } = window.supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/* ============================================================
   STATE
   ============================================================ */

const state = {
  user: null,
  profile: null,
  models: [],
  selectedModel: null,
  currentPage: "dashboard",
  currentConversation: null,
  messages: [],
  training: [],
  knowledge: [],
  memory: [],
  authMode: "login",
  logs: []
};

/* ============================================================
   HELPERS
   ============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2800);
}

function log(message){
  const time = new Date().toLocaleTimeString();

  state.logs.unshift({
    time,
    message
  });

  if(state.logs.length > 100){
    state.logs.length = 100;
  }

  console.log("[Nova]",message);
}

function formatDate(value){
  if(!value) return "";
  return new Date(value).toLocaleString();
}

function requireModel(){
  if(!state.selectedModel){
    toast("Create or select a model first.");
    showPage("models");
    return false;
  }

  return true;
}

/* ============================================================
   AUTH
   ============================================================ */

function renderAuthMode(){
  const login = state.authMode === "login";

  $("authTitle").textContent = login
    ? "Welcome back."
    : "Create your workspace.";

  $("authSub").textContent = login
    ? "Sign in to build, train and use your AI models."
    : "Create an account and start training your own AI.";

  $("nameField").style.display = login ? "none" : "block";

  $("authSubmit").textContent = login
    ? "Sign in"
    : "Create account";

  $("authSwitchText").textContent = login
    ? "Don't have an account?"
    : "Already have an account?";

  $("authSwitch").textContent = login
    ? "Create one"
    : "Sign in";
}

$("authSwitch").onclick = ()=>{
  state.authMode = state.authMode === "login"
    ? "signup"
    : "login";

  renderAuthMode();
};

$("authForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  if(!email || !password){
    toast("Enter your email and password.");
    return;
  }

  try{
    $("authSubmit").disabled = true;

    if(state.authMode === "login"){

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

    }else{

      const name = $("authName").value.trim();

      const { error } = await db.auth.signUp({
        email,
        password,
        options:{
          data:{
            name
          }
        }
      });

      if(error) throw error;

      toast("Account created. Check your email if confirmation is enabled.");
    }

  }catch(error){
    console.error(error);
    toast(error.message || "Authentication failed.");
  }finally{
    $("authSubmit").disabled = false;
  }
});

$("logoutBtn").onclick = async ()=>{
  await db.auth.signOut();
};

/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init(){

  renderAuthMode();

  const {
    data:{
      session
    }
  } = await db.auth.getSession();

  if(session){
    await boot(session.user);
  }

  db.auth.onAuthStateChange(async(event,session)=>{

    if(session?.user){
      await boot(session.user);
    }else{
      state.user = null;
      state.profile = null;
      state.models = [];
      $("app").classList.add("hidden");
      $("authScreen").classList.remove("hidden");
    }

  });
}

async function boot(user){

  state.user = user;

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("userEmail").textContent = user.email || "User";

  await loadProfile();
  await loadModels();

  if(!state.selectedModel && state.models.length){
    state.selectedModel = state.models[0];
  }

  showPage("dashboard");

  log("Application initialized.");
}

/* ============================================================
   PROFILE
   ============================================================ */

async function loadProfile(){

  const { data,error } = await db
    .from("profiles")
    .select("*")
    .eq("id",state.user.id)
    .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  state.profile = data;
}

/* ============================================================
   MODELS
   ============================================================ */

async function loadModels(){

  const { data,error } = await db
    .from("models")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    log("Could not load models: "+error.message);
    state.models = [];
    return;
  }

  state.models = data || [];

  if(state.selectedModel){
    const updated = state.models.find(
      x=>x.id === state.selectedModel.id
    );

    if(updated){
      state.selectedModel = updated;
    }
  }
}

async function createModel(){

  const name = prompt("Model name:");

  if(!name || !name.trim()) return;

  const description = prompt(
    "Description:",
    "A custom Nova AI model."
  );

  const avatar = prompt(
    "Avatar:",
    "✦"
  ) || "✦";

  const trainingMode = confirm(
    "Allow everyone to train this model?\n\nOK = Everyone\nCancel = Owner only"
  )
    ? "everyone"
    : "owner";

  const { data,error } = await db
    .from("models")
    .insert({
      owner_id:state.user.id,
      name:name.trim(),
      description:description || "",
      avatar,
      visibility:"public",
      training_mode:trainingMode,
      status:"active"
    })
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  state.models.unshift(data);
  state.selectedModel = data;

  toast("Model created.");
  log("Created model "+data.name);

  renderPage();
}

async function selectModel(id){

  const model = state.models.find(x=>x.id === id);

  if(!model) return;

  state.selectedModel = model;
  state.messages = [];
  state.currentConversation = null;

  toast("Using "+model.name);

  showPage("chat");
}

async function deleteModel(){

  if(!requireModel()) return;

  const model = state.selectedModel;

  if(model.owner_id !== state.user.id){
    toast("Only the model owner can delete it.");
    return;
  }

  if(!confirm(
    `Delete "${model.name}"?\n\nThis can remove its training data too.`
  )) return;

  const { error } = await db
    .from("models")
    .delete()
    .eq("id",model.id);

  if(error){
    toast(error.message);
    return;
  }

  state.models = state.models.filter(x=>x.id !== model.id);
  state.selectedModel = state.models[0] || null;

  toast("Model deleted.");

  showPage("models");
}

/* ============================================================
   PAGE SYSTEM
   ============================================================ */

const pageNames = {
  dashboard:"Dashboard",
  chat:"Playground",
  models:"My Models",
  training:"Training",
  knowledge:"Knowledge",
  memory:"Memory",
  settings:"Settings",
  diagnostics:"Diagnostics"
};

function showPage(page){

  state.currentPage = page;

  document.querySelectorAll(".nav button").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  $("topTitle").textContent = pageNames[page] || "Nova";

  renderPage();

  $("sidebar").classList.remove("open");
}

function renderPage(){

  const content = $("content");

  if(state.currentPage === "dashboard"){
    content.innerHTML = renderDashboard();
    bindDashboard();
  }

  if(state.currentPage === "models"){
    content.innerHTML = renderModels();
    bindModels();
  }

  if(state.currentPage === "chat"){
    content.innerHTML = renderChat();
    bindChat();
    scrollChat();
  }

  if(state.currentPage === "training"){
    content.innerHTML = renderTraining();
    bindTraining();
  }

  if(state.currentPage === "knowledge"){
    content.innerHTML = renderKnowledge();
    bindKnowledge();
  }

  if(state.currentPage === "memory"){
    content.innerHTML = renderMemory();
    bindMemory();
  }

  if(state.currentPage === "settings"){
    content.innerHTML = renderSettings();
    bindSettings();
  }

  if(state.currentPage === "diagnostics"){
    content.innerHTML = renderDiagnostics();
  }
}

            </p>
            <button id="chatCreate" class="primary" style="width:auto">
              Create model
            </button>
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="chat-page">

      <div class="chat-header">

        <div class="chat-avatar">
          ${escapeHTML(model.avatar || "✦")}
        </div>

        <div>
          <div class="chat-name">
            ${escapeHTML(model.name)}
          </div>

          <div class="chat-model">
            Model ${escapeHTML(model.id)}
          </div>
        </div>

        <div style="margin-left:auto">
          <span class="badge badge-green">
            System ready
          </span>
        </div>

      </div>

      <div id="chatMessages" class="chat-messages">

        ${
          state.messages.length
          ? state.messages.map(renderMessage).join("")
          : `
            <div class="empty-chat">
              <div class="empty-inner">

                <div class="empty-icon">
                  ${escapeHTML(model.avatar || "✦")}
                </div>

                <h2>
                  Talk to ${escapeHTML(model.name)}
                </h2>

                <p>
                  Ask anything. This model can use its shared
                  training data, knowledge and conversation memory.
                </p>

              </div>
            </div>
          `
        }

      </div>

      <div class="composer">

        <textarea
          id="chatInput"
          placeholder="Message ${escapeHTML(model.name)}..."
          rows="1"
        ></textarea>

        <button id="sendBtn" class="send">
          ↑
        </button>

      </div>

      <div class="composer-hint">
        Enter to send · Shift + Enter for a new line
      </div>

    </div>
  `;
}

function renderMessage(message){

  const user = message.role === "user";

  return `
    <div class="message ${user ? "user" : "ai"}">

      <div class="message-avatar">
        ${user ? "You" : "N"}
      </div>

      <div class="message-body">

        <div class="message-content">
          ${escapeHTML(message.content)}
        </div>

      </div>

    </div>
  `;
}

function bindChat(){

  $("chatCreate")?.addEventListener(
    "click",
    createModel
  );

  const input = $("chatInput");
  const send = $("sendBtn");

  if(!input || !send) return;

  send.onclick = sendChat;

  input.addEventListener("keydown",e=>{
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendChat();
    }
  });

  input.addEventListener("input",()=>{
    input.style.height="auto";
    input.style.height=Math.min(
      input.scrollHeight,
      160
    )+"px";
  });
}

async function sendChat(){

  if(!requireModel()) return;

  const input = $("chatInput");

  const text = input.value.trim();

  if(!text) return;

  input.value="";
  input.style.height="auto";

  state.messages.push({
    role:"user",
    content:text
  });

  renderPage();
  scrollChat();

  log("Sending chat request.");

  try{

    const { data,error } = await db.rpc(
      "nova_start_chat",
      {
        p_model_id:state.selectedModel.id,
        p_conversation_id:
          state.currentConversation?.id || null,
        p_messages:state.messages.slice(-20)
      }
    );

    if(error) throw error;

    if(data?.conversation_id){
      state.currentConversation = {
        id:data.conversation_id
      };
    }

    const requestId = data?.request_id;

    if(!requestId){

      state.messages.push({
        role:"assistant",
        content:
          data?.content ||
          "The model did not return a response."
      });

      renderPage();
      scrollChat();
      return;
    }

    state.messages.push({
      role:"assistant",
      content:""
    });

    renderPage();

    await pollChatResult(requestId);

  }catch(error){

    console.error(error);

    state.messages.push({
      role:"assistant",
      content:
        "I couldn't reach the model API. Check the model API configuration and Diagnostics page."
    });

    log("Chat error: "+error.message);

    renderPage();
    scrollChat();
  }
}

async function pollChatResult(requestId){

  const maxAttempts = 45;

  for(let attempt=0;attempt<maxAttempts;attempt++){

    await new Promise(
      resolve=>setTimeout(resolve,1000)
    );

    const { data,error } = await db.rpc(
      "nova_get_chat_result",
      {
        p_request_id:requestId
      }
    );

    if(error){
      throw error;
    }

    if(!data) continue;

    if(data.status === "completed"){

      const answer =
        data.content ||
        "The model returned an empty response.";

      const last =
        state.messages[state.messages.length-1];

      if(last?.role === "assistant"){
        last.content = answer;
      }else{
        state.messages.push({
          role:"assistant",
          content:answer
        });
      }

      renderPage();
      scrollChat();

      log("Chat request completed.");

      return;
    }

    if(data.status === "failed"){

      throw new Error(
        data.error || "Model API request failed."
      );
    }

    const last =
      state.messages[state.messages.length-1];

    if(last?.role === "assistant"){
      last.content =
        attempt % 2
        ? "Thinking…"
        : "Thinking...";
    }

    renderPage();
    scrollChat();
  }

  throw new Error("Model API timed out.");
}

function scrollChat(){

  requestAnimationFrame(()=>{
    const el = $("chatMessages");

    if(el){
      el.scrollTop = el.scrollHeight;
    }
  });
}

    "click",
    loadTraining
  );

  $("addTraining")?.addEventListener(
    "click",
    addTraining
  );

  document.querySelectorAll(".delete-training").forEach(btn=>{
    btn.onclick = ()=>{
      deleteTraining(btn.dataset.id);
    };
  });

  if(state.selectedModel && state.training.length === 0){
    loadTraining();
  }
}

async function addTraining(){

  if(!requireModel()) return;

  const question =
    $("trainQuestion").value.trim();

  const answer =
    $("trainAnswer").value.trim();

  const category =
    $("trainCategory").value.trim() || "general";

  if(!question || !answer){
    toast("Enter both a question and answer.");
    return;
  }

  const model = state.selectedModel;

  if(
    model.owner_id !== state.user.id &&
    model.training_mode !== "everyone"
  ){
    toast("This model is not open for public training.");
    return;
  }

  const { data,error } = await db
    .from("training_data")
    .insert({
      model_id:model.id,
      user_id:state.user.id,
      question,
      answer,
      category
    })
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  state.training.unshift(data);

  $("trainQuestion").value="";
  $("trainAnswer").value="";
  $("trainCategory").value="";

  toast("Training example added.");

  log("Training example added.");
  renderPage();
}

async function deleteTraining(id){

  const { error } = await db
    .from("training_data")
    .delete()
    .eq("id",id)
    .eq("user_id",state.user.id);

  if(error){
    toast(error.message);
    return;
  }

  state.training =
    state.training.filter(x=>x.id !== id);

  toast("Training example deleted.");

  renderPage();
}

    $("knowledgeContent").value.trim();

  if(!content){
    toast("Enter some knowledge.");
    return;
  }

  const { data,error } = await db
    .from("knowledge")
    .insert({
      model_id:state.selectedModel.id,
      user_id:state.user.id,
      title:title || "Untitled",
      category,
      content
    })
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  state.knowledge.unshift(data);

  $("knowledgeTitle").value="";
  $("knowledgeCategory").value="";
  $("knowledgeContent").value="";

  toast("Knowledge added.");

  renderPage();
}

async function deleteKnowledge(id){

  const { error } = await db
    .from("knowledge")
    .delete()
    .eq("id",id)
    .eq("user_id",state.user.id);

  if(error){
    toast(error.message);
    return;
  }

  state.knowledge =
    state.knowledge.filter(x=>x.id !== id);

  toast("Knowledge deleted.");

  renderPage();
}

/* ============================================================
   MEMORY
   ============================================================ */

async function loadMemory(){

  const { data,error } = await db
    .from("model_memory")
    .select("*")
    .eq("user_id",state.user.id)
    .order("created_at",{ascending:false});

  if(error){
    toast(error.message);
    return;
  }

  state.memory = data || [];

  renderPage();
}

function renderMemory(){

  return `
    <div class="page">

      <div class="page-head">

        <div>
          <h1 class="page-title">Memory</h1>

          <p class="page-sub">
            Personal information Nova can remember for your account.
          </p>
        </div>

      </div>

      <div class="card">

        <div class="field">
          <label>Memory</label>

          <textarea
            id="memoryContent"
            placeholder="Example: I prefer short answers."
          ></textarea>
        </div>

        <button
          id="addMemory"
          class="primary"
          style="width:auto"
        >
          Save memory
        </button>

      </div>

      <div class="section">

        <div class="section-title">
          Saved memories
        </div>

        <div class="card">

          ${
            state.memory.length
            ? state.memory.map(item=>`

              <div style="
                display:flex;
                align-items:flex-start;
                gap:12px;
                border-bottom:1px solid var(--line);
                padding:14px 0
              ">

                <div style="
                  flex:1;
                  font-size:13px;
                  line-height:1.5
                ">
                  ${escapeHTML(item.content)}
                </div>

                <button
                  class="danger delete-memory"
                  data-id="${item.id}"
                >
                  Delete
                </button>

              </div>

            `).join("")
            : `
              <div style="color:#737b88;font-size:13px">
                No memories saved.
              </div>
            `
          }

        </div>

      </div>

    </div>
  `;
}

function bindMemory(){

  $("addMemory")?.addEventListener(
    "click",
    addMemory
  );

  document.querySelectorAll(".delete-memory").forEach(btn=>{
    btn.onclick = ()=>{
      deleteMemory(btn.dataset.id);
    };
  });

  if(state.memory.length === 0){
    loadMemory();
  }
}

async function addMemory(){

  const content =
    $("memoryContent").value.trim();

  if(!content){
    toast("Enter something to remember.");
    return;
  }

  const { data,error } = await db
    .from("model_memory")
    .insert({
      user_id:state.user.id,
      content
    })
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  state.memory.unshift(data);

  $("memoryContent").value="";

  toast("Memory saved.");

  renderPage();
}

async function deleteMemory(id){

  const { error } = await db
    .from("model_memory")
    .delete()
    .eq("id",id)
    .eq("user_id",state.user.id);

  if(error){
    toast(error.message);
    return;
  }

  state.memory =
    state.memory.filter(x=>x.id !== id);

  renderPage();
}

function bindSettings(){

  $("saveSettings")?.addEventListener(
    "click",
    saveSettings
  );

  $("deleteModel")?.addEventListener(
    "click",
    deleteModel
  );
}

async function saveSettings(){

  if(!requireModel()) return;

  const updates = {
    name:$("settingName").value.trim(),
    description:$("settingDescription").value.trim(),
    avatar:$("settingAvatar").value.trim() || "✦",
    training_mode:$("settingTraining").value
  };

  if(!updates.name){
    toast("Model name is required.");
    return;
  }

  const { data,error } = await db
    .from("models")
    .update(updates)
    .eq("id",state.selectedModel.id)
    .eq("owner_id",state.user.id)
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  state.selectedModel = data;

  const index =
    state.models.findIndex(
      x=>x.id === data.id
    );

  if(index >= 0){
    state.models[index] = data;
  }

  toast("Settings saved.");

  renderPage();
}
