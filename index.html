<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — AI Buddy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07080c;
    --panel: #0d0f15;
    --panel2: #11141c;
    --panel3: #161a23;
    --border: rgba(255,255,255,.08);
    --border2: rgba(255,255,255,.13);
    --text: #f5f7fb;
    --muted: #8e96a8;
    --muted2: #697184;
    --accent: #8b7cff;
    --accent2: #a99fff;
    --danger: #ff5f6d;
    --success: #45d483;
    --radius: 16px;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    overflow: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* ============================================================
   AUTH
   ============================================================ */

.auth-screen {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(139,124,255,.16),
            transparent 38%
        ),
        var(--bg);
}

.auth-card {
    width: min(430px, 100%);
    padding: 34px;
    background: rgba(13,15,21,.92);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(25px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -.5px;
}

.logo-icon {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: linear-gradient(
        135deg,
        var(--accent),
        #5d50d8
    );
    box-shadow: 0 10px 30px rgba(139,124,255,.28);
}

.auth-card h1 {
    margin: 30px 0 8px;
    font-size: 32px;
    letter-spacing: -1px;
}

.auth-card p {
    margin: 0 0 26px;
    color: var(--muted);
}

.auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    padding: 4px;
    background: var(--panel3);
    border-radius: 11px;
    margin-bottom: 22px;
}

.auth-tabs button {
    border: 0;
    color: var(--muted);
    background: transparent;
    padding: 10px;
    border-radius: 8px;
}

.auth-tabs button.active {
    color: white;
    background: #252936;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #b5bccb;
    margin-bottom: 7px;
}

.input,
.textarea,
.select {
    width: 100%;
    border: 1px solid var(--border);
    outline: none;
    color: white;
    background: #0a0c11;
    border-radius: 11px;
    padding: 12px 13px;
    transition: .15s ease;
}

.input:focus,
.textarea:focus,
.select:focus {
    border-color: rgba(139,124,255,.65);
    box-shadow: 0 0 0 3px rgba(139,124,255,.09);
}

.textarea {
    min-height: 120px;
    resize: vertical;
}

.primary {
    width: 100%;
    border: 0;
    color: white;
    padding: 13px 16px;
    border-radius: 11px;
    font-weight: 700;
    background: linear-gradient(
        135deg,
        var(--accent),
        #6758e8
    );
    box-shadow: 0 12px 30px rgba(139,124,255,.18);
}

.primary:hover {
    filter: brightness(1.08);
}

.message {
    min-height: 20px;
    margin-top: 13px;
    color: var(--danger);
    font-size: 13px;
}

/* ============================================================
   APP
   ============================================================ */

.app {
    display: grid;
    grid-template-columns: 250px 1fr;
    width: 100%;
    height: 100%;
}

.sidebar {
    border-right: 1px solid var(--border);
    background: #090b10;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.sidebar-top {
    padding: 18px;
    border-bottom: 1px solid var(--border);
}

.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 800;
}

.sidebar-logo .logo-icon {
    width: 35px;
    height: 35px;
    font-size: 17px;
}

.nav {
    padding: 12px;
    display: grid;
    gap: 4px;
}

.nav button {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 14px;
}

.nav button:hover {
    background: rgba(255,255,255,.04);
    color: white;
}

.nav button.active {
    background: rgba(139,124,255,.12);
    color: white;
}

.sidebar-bottom {
    margin-top: auto;
    padding: 12px;
}

.user-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 13px;
}

.user-avatar {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: var(--panel3);
    border-radius: 10px;
}

.user-info {
    min-width: 0;
    flex: 1;
}

.user-email {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: white;
    font-size: 12px;
}

.logout {
    border: 0;
    background: transparent;
    color: var(--muted2);
    font-size: 12px;
}

/* ============================================================
   MAIN
   ============================================================ */

.main {
    min-width: 0;
    height: 100%;
    overflow: auto;
}

.page {
    width: min(1250px, 100%);
    margin: 0 auto;
    padding: 35px;
}

.page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
}

.page-header h1 {
    margin: 0 0 6px;
    font-size: 31px;
    letter-spacing: -1px;
}

.page-header p {
    margin: 0;
    color: var(--muted);
}

.button {
    border: 1px solid var(--border);
    color: white;
    background: var(--panel2);
    border-radius: 10px;
    padding: 10px 14px;
}

.button:hover {
    border-color: var(--border2);
    background: var(--panel3);
}

.button.primary-small {
    border: 0;
    background: var(--accent);
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
}

.stat {
    padding: 19px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: var(--radius);
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
    margin-top: 7px;
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
}

/* ============================================================
   MODEL CARDS
   ============================================================ */

.models-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
}

.model-card {
    border: 1px solid var(--border);
    background: linear-gradient(
        180deg,
        rgba(255,255,255,.025),
        rgba(255,255,255,.01)
    );
    border-radius: 17px;
    padding: 18px;
    transition: .18s ease;
}

.model-card:hover {
    transform: translateY(-2px);
    border-color: var(--border2);
}

.model-icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    background: var(--panel3);
    border-radius: 13px;
    font-size: 24px;
    margin-bottom: 16px;
}

.model-name {
    font-weight: 750;
    font-size: 17px;
}

.model-description {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    min-height: 39px;
    margin-top: 6px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 13px 0;
}

.badge {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 11px;
}

.badge.active {
    color: #78e5a5;
    border-color: rgba(69,212,131,.18);
    background: rgba(69,212,131,.07);
}

.model-open {
    width: 100%;
}

/* ============================================================
   WORKSPACE
   ============================================================ */

.workspace {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.workspace-header {
    padding: 18px 24px 0;
    border-bottom: 1px solid var(--border);
    background: #090b10;
}

.workspace-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.workspace-icon {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    background: var(--panel3);
    border-radius: 12px;
    font-size: 22px;
}

.workspace-title h2 {
    margin: 0;
    font-size: 19px;
}

.workspace-title p {
    margin: 2px 0 0;
    color: var(--muted2);
    font-size: 12px;
}

.tabs {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    margin-top: 18px;
}

.tabs button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 11px 14px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
}

.tabs button.active {
    color: white;
    border-bottom-color: var(--accent);
}

.workspace-content {
    flex: 1;
    overflow: auto;
    padding: 25px;
}

.panel {
    width: min(1000px, 100%);
    margin: 0 auto;
}

.panel-box {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 17px;
    padding: 20px;
    margin-bottom: 15px;
}

.panel-box h3 {
    margin: 0 0 6px;
}

.panel-box > p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.full {
    grid-column: 1 / -1;
}

.radio-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.radio {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
}

.radio:hover {
    border-color: var(--border2);
}

.radio strong {
    display: block;
    font-size: 13px;
}

.radio span {
    color: var(--muted);
    font-size: 11px;
}

.list {
    display: grid;
    gap: 9px;
    margin-top: 15px;
}

.list-item {
    border: 1px solid var(--border);
    background: #0a0c11;
    padding: 13px;
    border-radius: 11px;
}

.list-item strong {
    font-size: 13px;
}

.list-item p {
    color: var(--muted);
    font-size: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
}

/* ============================================================
   CHAT
   ============================================================ */

.chat-shell {
    width: min(900px, 100%);
    height: calc(100vh - 150px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0 25px;
}

.chat-empty {
    height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
}

.chat-empty-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

.chat-empty h2 {
    margin: 0 0 7px;
}

.chat-empty p {
    color: var(--muted);
}

.message-row {
    display: flex;
    margin: 14px 0;
}

.message-row.user {
    justify-content: flex-end;
}

.message-bubble {
    max-width: 78%;
    border-radius: 16px;
    padding: 12px 14px;
    line-height: 1.55;
    font-size: 14px;
    white-space: pre-wrap;
}

.message-row.user .message-bubble {
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 5px;
}

.message-row.assistant .message-bubble {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
}

.chat-input {
    display: flex;
    gap: 8px;
    border: 1px solid var(--border2);
    background: #0c0e14;
    border-radius: 15px;
    padding: 7px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.chat-input textarea {
    flex: 1;
    border: 0;
    outline: 0;
    resize: none;
    min-height: 44px;
    max-height: 150px;
    padding: 11px;
    background: transparent;
    color: white;
}

.send-button {
    align-self: flex-end;
    width: 43px;
    height: 43px;
    border: 0;
    border-radius: 11px;
    color: white;
    background: var(--accent);
}

/* ============================================================
   TOAST
   ============================================================ */

.toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 100;
    max-width: 370px;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border2);
    background: #151821;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    font-size: 13px;
}

.toast.error {
    border-color: rgba(255,95,109,.35);
}

.toast.success {
    border-color: rgba(69,212,131,.3);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 900px) {
    .app {
        grid-template-columns: 72px 1fr;
    }

    .sidebar-logo span,
    .nav button span,
    .user-info,
    .logout {
        display: none;
    }

    .sidebar-top {
        display: flex;
        justify-content: center;
    }

    .nav button {
        text-align: center;
        font-size: 18px;
    }

    .grid,
    .models-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 650px) {
    .page {
        padding: 20px;
    }

    .grid,
    .models-grid,
    .form-grid,
    .radio-row {
        grid-template-columns: 1fr;
    }

    .workspace-content {
        padding: 15px;
    }

    .message-bubble {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<!-- ============================================================
     AUTH SCREEN
     ============================================================ -->

<div id="authScreen" class="auth-screen">

    <div class="auth-card">

        <div class="logo">
            <div class="logo-icon">✦</div>
            <span>Nova</span>
        </div>

        <h1 id="authTitle">Welcome back</h1>

        <p id="authSubtitle">
            Your personal AI workspace.
        </p>

        <div class="auth-tabs">
            <button id="loginTab" class="active">
                Log in
            </button>

            <button id="signupTab">
                Create account
            </button>
        </div>

        <div class="field">
            <label>Email</label>
            <input
                id="authEmail"
                class="input"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
            >
        </div>

        <div class="field">
            <label>Password</label>
            <input
                id="authPassword"
                class="input"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
            >
        </div>

        <button id="authButton" class="primary">
            Log in
        </button>

        <div id="authMessage" class="message"></div>

    </div>

</div>

<!-- ============================================================
     APP
     ============================================================ -->

<div id="app" class="app hidden">

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="sidebar-logo">
                <div class="logo-icon">✦</div>
                <span>Nova</span>
            </div>

        </div>

        <nav class="nav">

            <button data-page="overview" class="active">
                ◈ <span>Overview</span>
            </button>

            <button data-page="models">
                ◉ <span>My models</span>
            </button>

            <button data-page="create">
                ＋ <span>Create model</span>
            </button>

            <button data-page="settings">
                ⚙ <span>Settings</span>
            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="user-box">

                <div class="user-avatar">
                    👤
                </div>

                <div class="user-info">
                    <div id="userEmail" class="user-email">
                        Loading...
                    </div>
                </div>

                <button id="logoutButton" class="logout">
                    Exit
                </button>

            </div>

        </div>

    </aside>

    <main id="main" class="main"></main>

</div>

<div id="toast" class="toast hidden"></div>

<script>
/* ============================================================
   SUPABASE CONFIG
   ============================================================

   Replace ONLY these two values.

   SUPABASE_URL:
   Supabase Dashboard
   → Project Settings
   → API
   → Project URL

   SUPABASE_PUBLISHABLE_KEY:
   Supabase Dashboard
   → Project Settings
   → API
   → Publishable key
   or the older "anon" key.

   NEVER put a service_role key here.
   ============================================================ */

const SUPABASE_URL =
    "https://jtstdajaaasucialvsfs.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1O9wO2dY_ZFFfdPFGaLeMA_3oaW2Hs-";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

/* ============================================================
   STATE
   ============================================================ */

let currentUser = null;
let currentModel = null;
let currentConversation = null;
let models = [];
let authMode = "login";
let workspaceTab = "playground";

/* ============================================================
   HELPERS
   ============================================================ */

const $ = id => document.getElementById(id);

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function toast(message, type = "") {
    const el = $("toast");

    el.textContent = message;
    el.className = "toast";

    if (type) {
        el.classList.add(type);
    }

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(() => {
        el.classList.add("hidden");
    }, 3200);
}

function showApp() {
    $("authScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
}

function showAuth() {
    $("authScreen").classList.remove("hidden");
    $("app").classList.add("hidden");
}

function setAuthMode(mode) {
    authMode = mode;

    $("loginTab").classList.toggle(
        "active",
        mode === "login"
    );

    $("signupTab").classList.toggle(
        "active",
        mode === "signup"
    );

    $("authTitle").textContent =
        mode === "login"
            ? "Welcome back"
            : "Create your account";

    $("authSubtitle").textContent =
        mode === "login"
            ? "Your personal AI workspace."
            : "Build and train your own AI models.";

    $("authButton").textContent =
        mode === "login"
            ? "Log in"
            : "Create account";

    $("authMessage").textContent = "";
}

function setMain(html) {
    $("main").innerHTML = html;
}

function requireUser() {
    if (!currentUser) {
        showAuth();
        return false;
    }

    return true;
}

/* ============================================================
   AUTH
   ============================================================ */

$("loginTab").onclick = () => setAuthMode("login");

$("signupTab").onclick = () => setAuthMode("signup");

$("authButton").onclick = async () => {

    const email = $("authEmail").value.trim();
    const password = $("authPassword").value;

    $("authMessage").textContent = "";

    if (!email || !password) {
        $("authMessage").textContent =
            "Enter your email and password.";

        return;
    }

    $("authButton").disabled = true;
    $("authButton").textContent = "Please wait...";

    try {

        if (authMode === "login") {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {
                throw error;
            }

            currentUser = data.user;

            await bootApp();

        } else {

            const { data, error } =
                await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            display_name:
                                email.split("@")[0]
                        }
                    }
                });

            if (error) {
                throw error;
            }

            /*
             * If Supabase email confirmation is disabled,
             * data.session exists and the user enters immediately.
             *
             * If confirmation is enabled, Supabase intentionally
             * returns no session. We don't show the old ugly
             * "Account created..." message.
             */
            if (data.session) {

                currentUser = data.user;

                await bootApp();

            } else {

                $("authMessage").textContent =
                    "Please confirm your email to continue.";

            }
        }

    } catch (error) {

        $("authMessage").textContent =
            error.message || "Authentication failed.";

    } finally {

        $("authButton").disabled = false;

        $("authButton").textContent =
            authMode === "login"
                ? "Log in"
                : "Create account";
    }
};

$("logoutButton").onclick = async () => {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentModel = null;
    currentConversation = null;

    showAuth();
};

/* ============================================================
   SESSION
   ============================================================ */

async function bootApp() {

    if (!currentUser) {
        return;
    }

    $("userEmail").textContent =
        currentUser.email || "User";

    showApp();

    await loadModels();

    renderOverview();
}

async function checkSession() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (session?.user) {

        currentUser = session.user;

        await bootApp();

    } else {

        showAuth();
    }
}

async function createModel() {

    const name =
        $("modelName").value.trim();

    const description =
        $("modelDescription").value.trim();

    const avatar =
        $("modelAvatar").value;

    const instructions =
        $("modelInstructions").value.trim();

    const visibility =
        document.querySelector(
            'input[name="visibility"]:checked'
        )?.value || "private";

    const trainingMode =
        document.querySelector(
            'input[name="trainingMode"]:checked'
        )?.value || "owner";

    if (!name) {
        toast(
            "Give your model a name.",
            "error"
        );

        return;
    }

    const button =
        $("createModelButton");

    button.disabled = true;
    button.textContent = "Creating...";

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "nova_create_model",
                {
                    p_name: name,
                    p_description: description,
                    p_avatar: avatar,
                    p_system_instructions:
                        instructions,
                    p_visibility: visibility,
                    p_training_mode: trainingMode
                }
            );

        if (error) {
            throw error;
        }

        await loadModels();

        const created =
            Array.isArray(data)
                ? data[0]
                : data;

        const model =
            models.find(
                x => x.id === created?.id
            ) || created;

        toast(
            "Model created.",
            "success"
        );

        if (model) {
            openModel(model);
        } else {
            renderModels();
        }

    } catch (error) {

        toast(
            error.message ||
            "Could not create model.",
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent = "Create model";
    }
}

async function loadOrCreateConversation() {

    const {
        data,
        error
    } = await supabaseClient
        .from("nova_conversations")
        .select("*")
        .eq("model_id", currentModel.id)
        .eq("user_id", currentUser.id)
        .order("updated_at", {
            ascending: false
        })
        .limit(1);

    if (error) {
        toast(
            error.message,
            "error"
        );

        return;
    }

    if (data?.length) {

        currentConversation =
            data[0];

    } else {

        const {
            data: created,
            error: createError
        } = await supabaseClient.rpc(
            "nova_create_conversation",
            {
                p_model_id:
                    currentModel.id,
                p_title:
                    "New conversation"
            }
        );

        if (createError) {

            toast(
                createError.message,
                "error"
            );

            return;
        }

        currentConversation =
            Array.isArray(created)
                ? created[0]
                : created;
    }

    await loadMessages();
}

async function loadMessages() {

    if (!currentConversation) {
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("nova_messages")
        .select("*")
        .eq(
            "conversation_id",
            currentConversation.id
        )
        .order("created_at", {
            ascending: true
        });

    if (error) {
        return;
    }

    const box =
        $("chatMessages");

    if (!box) {
        return;
    }

    if (!data?.length) {

        box.innerHTML = `
            <div class="chat-empty">

                <div>

                    <div class="chat-empty-icon">
                        ${escapeHtml(
                            currentModel.avatar
                        )}
                    </div>

                    <h2>
                        ${escapeHtml(
                            currentModel.name
                        )}
                    </h2>

                    <p>
                        Start a conversation.
                    </p>

                </div>

            </div>
        `;

        return;
    }

    box.innerHTML =
        data
            .filter(
                m =>
                    m.role === "user" ||
                    m.role === "assistant"
            )
            .map(
                m => `
                    <div class="message-row ${m.role}">
                        <div class="message-bubble">
                            ${escapeHtml(m.content)}
                        </div>
                    </div>
                `
            )
            .join("");

    box.scrollTop =
        box.scrollHeight;
}

async function sendChatMessage() {

    if (
        !currentModel ||
        !currentConversation
    ) {
        return;
    }

    const input =
        $("chatInput");

    const button =
        $("sendButton");

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    input.value = "";
    input.disabled = true;
    button.disabled = true;

    const box =
        $("chatMessages");

    const empty =
        box.querySelector(".chat-empty");

    if (empty) {
        empty.remove();
    }

    box.insertAdjacentHTML(
        "beforeend",
        `
            <div class="message-row user">
                <div class="message-bubble">
                    ${escapeHtml(message)}
                </div>
            </div>

            <div
                id="thinkingBubble"
                class="message-row assistant"
            >
                <div class="message-bubble">
                    Thinking...
                </div>
            </div>
        `
    );

    box.scrollTop =
        box.scrollHeight;

    try {

        const {
            data: job,
            error
        } = await supabaseClient.rpc(
            "nova_start_chat",
            {
                p_model_id:
                    currentModel.id,

                p_conversation_id:
                    currentConversation.id,

                p_message:
                    message
            }
        );

        if (error) {
            throw error;
        }

        const jobId =
            job;

        await pollChatJob(jobId);

    } catch (error) {

        const thinking =
            $("thinkingBubble");

        if (thinking) {
            thinking.remove();
        }

        box.insertAdjacentHTML(
            "beforeend",
            `
                <div class="message-row assistant">
                    <div class="message-bubble">
                        ${escapeHtml(
                            error.message ||
                            "Something went wrong."
                        )}
                    </div>
                </div>
            `
        );

    } finally {

        input.disabled = false;
        button.disabled = false;

        input.focus();
    }
}

async function pollChatJob(jobId) {

    const maxAttempts = 60;

    for (
        let attempt = 0;
        attempt < maxAttempts;
        attempt++
    ) {

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1000
                )
        );

        const {
            data,
            error
        } = await supabaseClient.rpc(
            "nova_poll_chat",
            {
                p_job_id: jobId
            }
        );

        if (error) {
            throw error;
        }

        if (data?.status === "complete") {

            const thinking =
                $("thinkingBubble");

            if (thinking) {
                thinking.remove();
            }

            const box =
                $("chatMessages");

            box.insertAdjacentHTML(
                "beforeend",
                `
                    <div class="message-row assistant">
                        <div class="message-bubble">
                            ${escapeHtml(
                                data.content
                            )}
                        </div>
                    </div>
                `
            );

            box.scrollTop =
                box.scrollHeight;

            return;
        }

        if (data?.status === "error") {

            const thinking =
                $("thinkingBubble");

            if (thinking) {
                thinking.remove();
            }

            throw new Error(
                data.error ||
                "The model API returned an error."
            );
        }
    }

    throw new Error(
        "The model took too long to respond."
    );
}

async function addTraining() {

    const question =
        $("trainingQuestion").value.trim();

    const answer =
        $("trainingAnswer").value.trim();

    const category =
        $("trainingCategory").value.trim();

    if (!question || !answer) {

        toast(
            "Enter both a question and answer.",
            "error"
        );

        return;
    }

    const {
        error
    } = await supabaseClient.rpc(
        "nova_add_training",
        {
            p_model_id:
                currentModel.id,

            p_question:
                question,

            p_answer:
                answer,

            p_category:
                category || "general"
        }
    );

    if (error) {

        toast(
            error.message,
            "error"
        );

        return;
    }

    $("trainingQuestion").value = "";
    $("trainingAnswer").value = "";

    toast(
        "Training added.",
        "success"
    );

    await loadTraining();
}

async function loadTraining() {

    const {
        data,
        error
    } = await supabaseClient
        .from("nova_training_data")
        .select("*")
        .eq("model_id", currentModel.id)
        .order("created_at", {
            ascending: false
        })
        .limit(100);

    if (error) {

        $("trainingList").textContent =
            error.message;

        return;
    }

    if (!data?.length) {

        $("trainingList").innerHTML = `
            <div style="color:var(--muted)">
                No training examples yet.
            </div>
        `;

        return;
    }

    $("trainingList").innerHTML =
        data.map(
            item => `
                <div class="list-item">

                    <strong>
                        ${escapeHtml(
                            item.question
                        )}
                    </strong>

                    <p>
                        ${escapeHtml(
                            item.answer
                        )}
                    </p>

                    <button
                        class="button"
                        data-delete-training="${item.id}"
                    >
                        Delete
                    </button>

                </div>
            `
        ).join("");

    document
        .querySelectorAll(
            "[data-delete-training]"
        )
        .forEach(button => {

            button.onclick =
                async () => {

                    const {
                        error
                    } = await supabaseClient
                        .from("nova_training_data")
                        .delete()
                        .eq(
                            "id",
                            button.dataset.deleteTraining
                        );

                    if (error) {

                        toast(
                            error.message,
                            "error"
                        );

                        return;
                    }

                    await loadTraining();
                };

                        .from("nova_knowledge")
                        .delete()
                        .eq(
                            "id",
                            button.dataset.deleteKnowledge
                        );

                    if (error) {

                        toast(
                            error.message,
                            "error"
                        );

                        return;

                    await loadKnowledge();

                >
                    Save API
                </button>

                <div
                    id="apiStatus"
                    style="
                        margin-top:15px;
                        color:var(--muted);
                        font-size:13px;
                    "
                >
                    Checking configuration...
                </div>

            </div>

            <div class="panel-box">

                <h3>
                    Expected API format
                </h3>

                <p>
                    Nova sends an OpenAI-compatible chat request.
                </p>

                <pre style="
                    white-space:pre-wrap;
                    color:#b8c0d0;
                    background:#080a0f;
                    padding:15px;
                    border-radius:10px;
                    overflow:auto;
                ">POST /v1/chat/completions

Authorization: Bearer 8io_xxxxxxxxx

{
  "model": "your-model",
  "messages": [
    {
      "role": "system",
      "content": "..."
    },
    {
      "role": "user",
      "content": "Hello"
    }
  ]
}</pre>

            </div>

        </div>
    `;

    $("saveApi").onclick =
        saveApi;

    await loadApiStatus();
}

async function loadApiStatus() {

    const {
        data,
        error
    } = await supabaseClient.rpc(
        "nova_api_status",
        {
            p_model_id:
                currentModel.id
        }
    );

    if (error) {

        $("apiStatus").textContent =
            error.message;

        return;
    }

    const status =
        Array.isArray(data)
            ? data[0]
            : data;

    if (status?.configured) {

        $("apiStatus").innerHTML = `
            <span style="color:var(--success)">
                ● API configured
            </span>
            <br>
            ${escapeHtml(
                status.endpoint_url || ""
            )}
        `;

    } else {

        $("apiStatus").innerHTML = `
            <span style="color:var(--muted)">
                ● No API configured
            </span>
        `;
    }
}

async function saveApi() {

    const endpoint =
        $("apiEndpoint").value.trim();

    const key =
        $("apiKey").value.trim();

    if (!endpoint || !key) {

        toast(
            "Enter both the endpoint and API key.",
            "error"
        );

        return;
    }

    if (!endpoint.startsWith("https://")) {

        toast(
            "The endpoint must use HTTPS.",
            "error"
        );

        return;
    }

    if (!key.startsWith("8io_")) {

        toast(
            "The API key must start with 8io_.",
            "error"
        );

        return;
    }

    const {
        error
    } = await supabaseClient.rpc(
        "nova_save_api_credentials",
        {
            p_model_id:
                currentModel.id,

            p_endpoint_url:
                endpoint,

            p_api_key:
                key
        }
    );

    if (error) {

        toast(
            error.message,
            "error"
        );

        return;
    }

    $("apiKey").value = "";

    toast(
        "API configuration saved.",
        "success"
    );

    await loadApiStatus();
}

async function saveModelSettings() {

    const name =
        $("editModelName").value.trim();

    const description =
        $("editModelDescription").value.trim();

    const instructions =
        $("editModelInstructions").value.trim();

    if (!name) {

        toast(
            "Model name cannot be empty.",
            "error"
        );

        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("nova_models")
        .update({
            name,
            description,
            system_instructions:
                instructions
        })
        .eq(
            "id",
            currentModel.id
        )
        .eq(
            "owner_id",
            currentUser.id
        )
        .select()
        .single();

    if (error) {

        toast(
            error.message,
            "error"
        );

        return;
    }

    currentModel = data;

    const index =
        models.findIndex(
            x =>
                x.id ===
                currentModel.id
        );

    if (index >= 0) {
        models[index] =
            currentModel;
    }

    toast(
        "Model updated.",
        "success"
    );

    renderWorkspace();
}
